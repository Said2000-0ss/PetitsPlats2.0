<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon restaurant</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">


</head>

<body>


    <div id="partieImage">
        <div class="header-text"> LES PETITS PLATS
            <i id="circle" class="fa-solid fa-record-vinyl"></i>
        </div>

        <img src="Images/Maskgroup.png" alt="">
        <div class="search-container">

            <p class="search-text">CHERCHEZ PARMI PLUS DE 1500 RECETTES<br>DU QUOTIDIEN, SIMPLES ET DELICIEUSES</p>
            <input type="text" id="searchInput" class="search-input"
                placeholder="Recherche une recette, un ingrédient, ...">
            <div id="croixGrandeBarre">X</div>
            <button id="searchButton" class="search-button">
                <span class="fa-stack fa-2x" style="flex-shrink: 0;">
                    <i class="fas fa-square fa-stack-2x" style="color: gray;"></i>
                    <i class="fas fa-magnifying-glass fa-stack-1x fa-inverse"></i>
                </span>
            </button>
        </div>
    </div>
    <div id="partieSelect">



        <div id="ingredients">
            <div id="ingredients-container" class="ingredients-dropdown">
                <span id="ingredients-text">Ingrédients</span>
                <i id="ingredients-chevron" class="fa-solid fa-chevron-down"></i>
            </div>


            <div id="ingredients-content" class="hidden">

                <div class="input-container">
                    <input id="inputIngredients" type="text" placeholder="Rechercher un ingredient...">
                    <button id="search-button">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div>
                <div id="containerChoix">
                    <div id="affichageChoixIngredients">

                    </div>
                    <div id="croixIngredients">X</div>
                </div>

                <ul id="ingredients-list">

                </ul>
            </div>
        </div>

        <div id="appareils">
            <div id="appareils-container" class="appareils-dropdown">
                <span id="appareils-text">Appareils</span>
                <i id="appareils-chevron" class="fa-solid fa-chevron-down"></i>
            </div>




            <div id="appareils-content" class="hidden">

                <div class="input-container">
                    <input id="inputAppareils" type="text" placeholder="Rechercher un appareil...">
                    <button id="search-button1">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div>

                <div id="containerChoixAppareils">
                    <div id="affichageChoixAppareils">

                    </div>
                    <div id="croixAppareils">X</div>
                </div>


                <ul id="appareils-list">
                </ul>
            </div>


        </div>



        <div id="ustensiles">
            <div id="ustensiles-container" class="ustensiles-dropdown">
                <span id="ustensiles-text">Ustensiles</span>
                <i id="ustensiles-chevron" class="fa-solid fa-chevron-down"></i>
            </div>

            <div id="ustensiles-content" class="hidden">

                <div class="input-container">
                    <input id="inputUstensiles" type="text" placeholder="Rechercher un ustensile...">
                    <button id="search-button2">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div>
                <div id="containerChoixUstensiles">
                    <div id="affichageChoixUstensiles">

                    </div>
                    <div id="croixUstensiles">X</div>
                </div>


                <ul id="ustensiles-list">
                </ul>
            </div>



        </div>

        <span id="nbRecettes"></span>
    </div>


    <div id="AffichageChoix">
        <div id="result-container"></div>
        <div id="result-container-appareils"></div>
        <div id="result-container-ustensiles"></div>

    </div>
    <div id="partieRecettes">

    </div>
    <script type="module" src="recipes.js"></script>
    <script type="module" src="recipesTest.js"></script>
    <script type="module" src="traitements.js"></script>
</body>

</html>
